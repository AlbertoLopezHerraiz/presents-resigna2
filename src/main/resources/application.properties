# ==========================================
# CONFIGURACIÓN DEL .ENV
# ==========================================
spring.config.import=optional:file:.env[.properties]

# ==========================================
# APLICACIÓN
# ==========================================

spring.application.name=regalos
server.port=${SERVER_PORT:8082}

# ==========================================
# BASE DE DATOS - POSTGRESQL
# ==========================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# ==========================================
# FLYWAY
# ==========================================

spring.flyway.default-schema=regalos
spring.flyway.schemas=regalos

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.properties.hibernate.default_schema=regalos

# ==========================================
# INTERNACIONALIZACIÓN
# ==========================================

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ==========================================
# SMTP - CORREO ELECTRÓNICO
# ==========================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# Destinatario del correo de prueba
app.mail.test-recipient=${MAIL_TEST_RECIPIENT}